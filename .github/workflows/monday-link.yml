# Informational only — not a required check. Posts/updates a sticky PR comment
# linking every monday.com ticket referenced in the PR's commits (scope format
# enforced by commitlint.config.mjs: `type(9-11 digit id | Headless): message`).
# Requires org-level secrets MONDAY_API_TOKEN + MONDAY_WORKSPACE_SUBDOMAIN so
# every repo cloned from this skeleton inherits them with no per-repo setup.
name: monday-link

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  monday-link:
    name: monday-link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Resolve monday.com tickets and upsert PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_WORKSPACE_SUBDOMAIN: ${{ vars.MONDAY_WORKSPACE_SUBDOMAIN }}
        run: |
          if [ ! -f scripts/monday-pr-comment.mjs ]; then
            echo "monday-pr-comment.mjs missing — skipped"
            exit 0
          fi
          if [ -z "${MONDAY_API_TOKEN}" ]; then
            echo "MONDAY_API_TOKEN not set — skipped (informational workflow)"
            exit 0
          fi
          node scripts/monday-pr-comment.mjs '${{ github.event.pull_request.number }}'
